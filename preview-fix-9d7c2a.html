<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>DamianMusic Preview Fix</title><style>body{margin:0;background:#050506;color:#fff;font:15px/1.5 Arial,sans-serif;display:grid;place-items:center;min-height:100vh}.box{width:min(560px,calc(100vw - 32px));border:1px solid rgba(255,40,75,.55);box-shadow:0 0 35px rgba(255,35,73,.15);background:#0b0b0f;padding:28px;border-radius:18px}h1{margin:0 0 8px;font-size:26px}p{color:#aaa}input{display:block;width:100%;margin:18px 0;padding:14px;background:#111117;color:#fff;border:1px solid #333;border-radius:10px;box-sizing:border-box}button{width:100%;padding:14px;border:0;border-radius:10px;background:#ff2349;color:white;font-weight:800;cursor:pointer}button:disabled{opacity:.5}.status{margin-top:16px;min-height:24px}.ok{color:#68e391}.bad{color:#ff7188}</style></head><body><main class="box"><h1>Upload the full preview</h1><p>This uploads the real DamianMusic preview once so the website player can play the complete track instead of the broken short file.</p><input id="file" type="file" accept="audio/mpeg,.mp3"><button id="upload">Upload full MP3</button><div id="status" class="status"></div></main><script>const URL='https://wutlhceqkioshepfbykf.supabase.co/storage/v1/object/service-media/site/damianmusic-preview-full.mp3';const PUBLIC='https://wutlhceqkioshepfbykf.supabase.co/storage/v1/object/public/service-media/site/damianmusic-preview-full.mp3';const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind1dGxoY2Vxa2lvc2hlcGZieWtmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMDAxMDUsImV4cCI6MjEwMTU3NjEwNX0.Ad9wROEhZ2uKxKx9H5AHqCCmFa0nTezrBHkAn-Zwyws';const f=document.getElementById('file'),b=document.getElementById('upload'),s=document.getElementById('status');const fmt=n=>`${Math.floor(n/60)}:${String(Math.floor(n%60)).padStart(2,'0')}`;b.onclick=async()=>{const file=f.files?.[0];if(!file){s.className='status bad';s.textContent='Choose the MP3 first.';return}b.disabled=true;s.className='status';s.textContent='Uploading…';try{const r=await fetch(URL,{method:'POST',headers:{apikey:KEY,Authorization:`Bearer ${KEY}`,'Content-Type':'audio/mpeg','Cache-Control':'no-cache'},body:file});let d={};try{d=await r.json()}catch{}if(!r.ok&&r.status!==409)throw new Error(d.message||d.error||`Upload failed (${r.status})`);s.textContent='Checking the full track…';const a=new Audio(PUBLIC+'?t='+Date.now());await new Promise((resolve,reject)=>{a.onloadedmetadata=resolve;a.onerror=()=>reject(new Error('Uploaded, but the public audio could not be checked.'));a.load()});s.className='status ok';s.textContent=`Done ✓ Full track detected: ${fmt(a.duration)}. You can close this page and refresh damionmusic.nl.`}catch(e){s.className='status bad';s.textContent=e.message||'Upload failed.'}finally{b.disabled=false}};</script></body></html>
